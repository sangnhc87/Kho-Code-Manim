name: Render COMB11 V2 - Hoan vi vong tron

on:
  workflow_dispatch:
    inputs:
      quality:
        description: '480p preview or 1080p Full HD'
        type: choice
        required: true
        default: preview
        options: [preview, fullhd]
      voice:
        description: 'Vietnamese TTS; on requires external TTS access'
        type: choice
        required: true
        default: 'off'
        options: ['off', 'on']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install FFmpeg, Manim libraries and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Mathematics and production tests
        run: python -m unittest discover -s tests -v
      - name: Prepare PNG formula sheets, voice and synchronized subtitles
        env:
          COMB11_VOICE: ${{ inputs.voice }}
        run: python scripts/prepare_comb11_v2.py --voice "$COMB11_VOICE"
      - name: Render preview 854x480 24 fps
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 episodes/comb11_circular_permutations.py COMB11
      - name: Render final Full HD 1920x1080 30 fps
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb11_circular_permutations.py COMB11
      - name: Verify MP4 time, audio stream, frame captures
        env:
          COMB11_VOICE: ${{ inputs.voice }}
        run: |
          VIDEO=$(find media/videos -type f -name 'COMB11.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_comb11_v2.py --video "$VIDEO" --voice "$COMB11_VOICE"
      - name: Always upload video, PNG screenshots and QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMB11-V2-${{ inputs.quality }}-voice-${{ inputs.voice }}
          path: |
            media/videos/**/COMB11.mp4
            qa_comb11_v2/
            preview/comb11_v2/
            narration_COMB11_v2.md
            subtitles_COMB11_v2.srt
            voice/comb11_voice_manifest.json
          if-no-files-found: warn
          retention-days: 7
