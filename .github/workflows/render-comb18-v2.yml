name: Render COMB18 V2 - Tam giac Pascal - tinh chat va ung dung

on:
  workflow_dispatch:
    inputs:
      quality:
        description: '480p preview or 1080p Full HD'
        type: choice
        required: true
        default: preview
        options: [preview, fullhd]
      voice:
        description: 'Vietnamese TTS; on requires external TTS access'
        type: choice
        required: true
        default: 'off'
        options: ['off', 'on']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: Series-Dai-So-To-Hop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install FFmpeg, Manim libraries and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Mathematics and production tests
        run: python -m unittest discover -s tests -v
      - name: Prepare PNG formula sheets, voice and synchronized subtitles
        env:
          COMB18_VOICE: ${{ inputs.voice || 'off' }}
        run: python scripts/prepare_comb18_v2.py --voice "$COMB18_VOICE"
      - name: Render preview 854x480 24 fps
        if: ${{ inputs.quality == 'preview' || github.event_name == 'push' }}
        run: manim -ql -r 854,480 --fps 24 episodes/comb18_pascal_triangle.py COMB18
      - name: Render final Full HD 1920x1080 30 fps
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb18_pascal_triangle.py COMB18
      - name: Verify MP4 time, audio stream, frame captures
        env:
          COMB18_VOICE: ${{ inputs.voice || 'off' }}
        run: |
          VIDEO=$(find media/videos -type f -name 'COMB18.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_comb18_v2.py --video "$VIDEO" --voice "$COMB18_VOICE"
      - name: Always upload video, PNG screenshots and QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMB18-V2-${{ inputs.quality }}-voice-${{ inputs.voice || 'off' }}
          path: |
            Series-Dai-So-To-Hop/media/videos/**/COMB18.mp4
            Series-Dai-So-To-Hop/qa_comb18_v2/
            Series-Dai-So-To-Hop/preview/comb18_v2/
            Series-Dai-So-To-Hop/narration_COMB18_v2.md
            Series-Dai-So-To-Hop/subtitles_COMB18_v2.srt
            Series-Dai-So-To-Hop/voice/comb18_voice_manifest.json
          if-no-files-found: warn
          retention-days: 7
