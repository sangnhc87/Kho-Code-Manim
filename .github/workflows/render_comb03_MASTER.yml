name: Render COMB03 - Manim + Typst

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Render quality - preview or Full HD'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - fullhd
      notation:
        description: 'Formula indices: user = C^n_k; sgk = C_n^k'
        required: true
        default: user
        type: choice
        options:
          - user
          - sgk

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMB_NOTATION: ${{ inputs.notation }}
    defaults:
      run:
        working-directory: Series-Dai-So-To-Hop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Manim system dependencies and Vietnamese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev fonts-noto-core

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Check all mathematical examples and code syntax
        run: python -m unittest discover -s tests -v

      - name: Compile Typst math assets (required for output)
        run: python scripts/build_formulas.py

      - name: Render COMB03 preview
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql --fps 24 episodes/comb03_tree_sample_space.py COMB03

      - name: Render COMB03 Full HD
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb03_tree_sample_space.py COMB03

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: COMB03-${{ inputs.quality }}-${{ inputs.notation }}
          path: Series-Dai-So-To-Hop/media/videos/**/COMB03.mp4
          if-no-files-found: error
          retention-days: 7
