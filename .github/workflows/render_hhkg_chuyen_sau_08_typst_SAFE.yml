name: Render HHKG Chuyen Sau 08 - Typst SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "Manim-Typst/hhkg_chuyen_sau_08_ty_so_the_tich_nang_cao_manim_typst_SAFE.py"
      - ".github/workflows/render_hhkg_chuyen_sau_08_typst_SAFE.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            fonts-dejavu-core \
            fonts-noto-core

      - name: Install Manim Typst and Edge TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "manim==0.21.0" "typst>=0.14" "edge-tts==7.2.8"

      - name: Print versions
        run: |
          python - <<'PY'
          import manim, typst, edge_tts
          print("Manim:", manim.__version__)
          print("Typst module:", typst)
          print("Edge TTS:", edge_tts.__version__)
          PY

      - name: Python syntax check
        run: |
          python -m py_compile Manim-Typst/hhkg_chuyen_sau_08_ty_so_the_tich_nang_cao_manim_typst_SAFE.py

      - name: Reject known-bad Typst math syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          path = Path("Manim-Typst/hhkg_chuyen_sau_08_ty_so_the_tich_nang_cao_manim_typst_SAFE.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          expressions = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "mty":
                  if node.args and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str):
                      expressions.append(node.args[0].value)
              if isinstance(node, ast.Tuple) and len(node.elts) >= 2:
                  a, b = node.elts[0], node.elts[1]
                  if (isinstance(a, ast.Constant) and a.value == "math" and
                      isinstance(b, ast.Constant) and isinstance(b.value, str)):
                      expressions.append(b.value)

          forbidden = re.compile(r"(?<![A-Za-z])(sect|intersect|angle)(?![A-Za-z])")
          bad = [expr for expr in expressions if forbidden.search(expr) or "/" in expr]
          if bad:
              print("Invalid Typst math expressions:")
              for expr in bad:
                  print(" -", expr)
              raise SystemExit("Use inter, hat(...), and frac(..., ...) in HHKG Typst math.")
          print(f"Checked {len(expressions)} static math expressions: syntax policy OK.")
          PY

      - name: Typst math preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          from manim import MathTypst

          tests = [
              "frac(S M, S A) = frac(3, 5)",
              "frac(V_(S M N P), V_(S A B C)) = frac(3, 5) frac(2, 3) frac(4, 5)",
              "frac(S_(A M C), S_(B M C)) = frac(A M, M B)",
              "frac(V_(S A M N), V_(S A B C)) = frac(3, 10)",
              "frac(V_1, V_3) = frac(V_1, V_2) frac(V_2, V_3)",
              "t times (1-t) = frac(1, 4) - (t-frac(1, 2))^2",
              "frac(d(G,(B C D)), d(A,(B C D))) = frac(1, 4)",
              "V_(G B C D) = frac(1, 4) V_(A B C D)",
              "V_O = V_T - 4 V_C",
              "V_O = frac(1, 2) V_T",
              "x times frac(2, 3) times frac(3, 4) = frac(1, 5)",
              "(P) inter (Q) = d",
              "a perp b",
              "a parallel (P)",
              "alpha = hat(A B C, size: #145%)",
          ]

          path = Path("Manim-Typst/hhkg_chuyen_sau_08_ty_so_the_tich_nang_cao_manim_typst_SAFE.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          extracted = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "mty":
                  if node.args and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str):
                      extracted.append(node.args[0].value)
              if isinstance(node, ast.Tuple) and len(node.elts) >= 2:
                  a, b = node.elts[0], node.elts[1]
                  if (isinstance(a, ast.Constant) and a.value == "math" and
                      isinstance(b, ast.Constant) and isinstance(b.value, str)):
                      extracted.append(b.value)

          expressions = list(dict.fromkeys(tests + extracted))
          forbidden = re.compile(r"(?<![A-Za-z])(sect|intersect|angle)(?![A-Za-z])")
          for expr in expressions:
              if forbidden.search(expr):
                  raise SystemExit(f"Forbidden Typst token in: {expr!r}")
              if "/" in expr:
                  raise SystemExit(f"Slash fraction forbidden in: {expr!r}. Use frac(..., ...).")
              MathTypst(expr)
              print("OK:", expr)
          print(f"Preflight complete: {len(expressions)} Typst expressions compiled.")
          PY

      - name: Render lesson
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -o pipefail
          python Manim-Typst/hhkg_chuyen_sau_08_ty_so_the_tich_nang_cao_manim_typst_SAFE.py 2>&1 | tee render_hhkg08.log

      - name: Find and verify final video
        shell: bash
        run: |
          VIDEO=$(find media -type f -name 'hhkg_chuyen_sau_08_ty_so_the_tich_nang_cao_typst_SAFE_1080p_WITH_AUDIO.mp4' | head -n 1)
          test -n "$VIDEO"
          echo "Final video: $VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json "$VIDEO"
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: hhkg-chuyen-sau-08-ty-so-the-tich-nang-cao-typst-safe
          path: ${{ env.VIDEO }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhkg-08-render-log
          path: render_hhkg08.log
          if-no-files-found: ignore
          retention-days: 7
