name: Render HHKG Chuyen Sau 01 - Typst Premium

on:
  workflow_dispatch:
  push:
    paths:
      - "Manim-Typst/hhkg_chuyen_sau_01_manim_typst_PREMIUM.py"
      - ".github/workflows/render_hhkg_chuyen_sau_01_typst_PREMIUM.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            fonts-dejavu-core \
            fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "manim==0.21.0" "typst>=0.14" "edge-tts==7.2.8"
          python - <<'PY'
          import manim, typst
          from manim import MathTypst
          print("Manim:", manim.__version__)
          print("Typst module:", typst)
          MathTypst("tan alpha = 3/(4 sqrt(2))")
          MathTypst("(M N P Q) parallel (A B C D)")
          print("MathTypst preflight OK")
          PY

      - name: Syntax check
        run: |
          python -m py_compile Manim-Typst/hhkg_chuyen_sau_01_manim_typst_PREMIUM.py

      - name: Render lesson
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python Manim-Typst/hhkg_chuyen_sau_01_manim_typst_PREMIUM.py 2>&1 | tee render.log

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhkg-01-premium-render-log
          path: render.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find and verify final video
        shell: bash
        run: |
          VIDEO=$(find media -type f -name 'hhkg_chuyen_sau_01_manim_typst_PREMIUM_1080p_WITH_AUDIO.mp4' | head -n 1)
          test -n "$VIDEO"
          echo "Final video: $VIDEO"
          ffprobe -v error \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json "$VIDEO"
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: hhkg-chuyen-sau-01-typst-premium
          path: ${{ env.VIDEO }}
          if-no-files-found: error
          retention-days: 14
