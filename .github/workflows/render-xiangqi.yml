name: Tinh Hoa Co Tan - Manim Typst
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'latest, all, tap-0001,tap-0002 or range:0001-0016'
        type: string
        default: latest
        required: true
      quality:
        description: 'Nhanh 480p hoac xuat 1080p'
        type: choice
        options: [preview, full]
        default: preview
      voice:
        description: 'zalo=nam mien Nam (ZALO_API_KEY), edge=nam tieng Viet'
        type: choice
        options: [zalo, edge]
        default: edge
  push:
    paths:
      - 'Tinh-Hoa-Co-Tan/episodes/**'
      - 'Tinh-Hoa-Co-Tan/src/**'
      - 'Tinh-Hoa-Co-Tan/scripts/**'
      - 'Tinh-Hoa-Co-Tan/requirements.txt'
      - '.github/workflows/render-xiangqi.yml'
permissions:
  contents: write
concurrency:
  group: cotan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Tinh-Hoa-Co-Tan
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        env:
          REQUESTED: ${{ github.event.inputs.episodes || 'latest' }}
        run: echo "matrix=$(python scripts/plan.py "$REQUESTED")" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Tinh-Hoa-Co-Tan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tinh-Hoa-Co-Tan/requirements.txt
      - name: Install graphics / audio / fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-noto-core fonts-noto-cjk
          python -m pip install -r requirements.txt
      - uses: typst-community/setup-typst@v5
      - name: Unit tests and board layout validation
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Validate moves BEFORE creating audio/video
        run: python scripts/produce.py --episode "${{ matrix.episode }}" --skip-render
      - name: Produce mp4
        env:
          ZALO_API_KEY: ${{ secrets.ZALO_API_KEY }}
          QUALITY: ${{ github.event.inputs.quality || 'preview' }}
          VOICE: ${{ github.event.inputs.voice || 'edge' }}
        run: |
          python scripts/produce.py --episode "${{ matrix.episode }}" --quality "$QUALITY" --voice "$VOICE"
          python scripts/make_short.py --episode "${{ matrix.episode }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cotan-${{ matrix.episode }}
          path: |
            Tinh-Hoa-Co-Tan/output/${{ matrix.episode }}/${{ matrix.episode }}.mp4
            Tinh-Hoa-Co-Tan/output/${{ matrix.episode }}/${{ matrix.episode }}_short.mp4
            Tinh-Hoa-Co-Tan/output/${{ matrix.episode }}/episode.json
          if-no-files-found: error
          retention-days: 14

      - name: Auto Upload Full HD & Shorts to YouTube (Public)
        if: ${{ inputs.quality == 'full' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          VIDEO="output/${{ matrix.episode }}/${{ matrix.episode }}.mp4"
          SHORT_VIDEO="output/${{ matrix.episode }}/${{ matrix.episode }}_short.mp4"
          EP_NUM=$(echo "${{ matrix.episode }}" | sed 's/tap-//' | sed 's/^0*//')

          # 1. Tải bản Full HD (16:9) lên Playlist chính
          python ../scripts/upload_to_youtube.py \
            --file "$VIDEO" \
            --series cotan \
            --lesson "$EP_NUM" \
            --category-id 20 \
            --privacy public || true

          # 2. Tải bản YouTube Shorts (9:16) lên kênh
          if [ -f "$SHORT_VIDEO" ]; then
            python ../scripts/upload_to_youtube.py \
              --file "$SHORT_VIDEO" \
              --series cotan \
              --lesson "$EP_NUM" \
              --short \
              --category-id 20 \
              --privacy public || true
          fi
      - name: Commit and Push YouTube History
        if: ${{ inputs.quality == 'full' }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ../youtube_uploaded_history.json
          git commit -m "docs(cotan): auto-update youtube_uploaded_history.json for ${{ matrix.episode }}" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push
