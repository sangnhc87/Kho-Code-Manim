name: Tinh Hoa Co Tan - Manim Typst
# Quy trình: (tuỳ chọn) dựng tập mới từ giáo trình bằng bảng tra chessdb.cn
# -> kiểm tra -> render Manim song song -> (quality=full) đăng YouTube.
on:
  workflow_dispatch:
    inputs:
      build_count:
        description: 'Dựng thêm bao nhiêu tập mới theo giáo trình (0 = không dựng)'
        type: number
        default: 0
      episodes:
        description: 'Tập cần render: new (vừa dựng) | latest | unpublished | ep-0001,ep-0002 | range:1-5'
        type: string
        default: new
      quality:
        description: 'preview = 480p xem thử (không đăng); full = 1080p và ĐĂNG YOUTUBE'
        type: choice
        options: [preview, full]
        default: preview
      targets:
        description: 'Dựng gì: both = video + Short; video = chỉ video; short = chỉ Short'
        type: choice
        options: [short, both, video]
        default: short
      voice:
        description: 'edge = giọng nam tiếng Việt; zalo = nam miền Nam (cần ZALO_API_KEY)'
        type: choice
        options: [edge, zalo]
        default: edge
  schedule:
    # Mỗi ngày 2 tập mới (chỉ chạy khi biến repo COTAN_DAILY = true).
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
permissions:
  contents: write
# Không đặt concurrency: GitHub chỉ giữ một lượt chờ và huỷ các lượt chờ cũ.
# Lưu ý vận hành: không chạy hai lượt có build_count > 0 cùng lúc (trùng số tập).
env:
  BUILD_COUNT: ${{ github.event_name == 'schedule' && 2 || inputs.build_count }}
  EPISODES: ${{ github.event_name == 'schedule' && 'catchup' || inputs.episodes }}
  QUALITY: ${{ github.event_name == 'schedule' && 'full' || inputs.quality }}
  VOICE: ${{ github.event_name == 'schedule' && 'edge' || inputs.voice }}
  TARGETS: ${{ github.event_name == 'schedule' && 'short' || inputs.targets }}
jobs:
  build:
    if: github.event_name != 'schedule' || vars.COTAN_DAILY == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Tinh-Hoa-Co-Tan
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (luật cờ đối chiếu cache chessdb, ký pháp, kịch bản)
        run: CDB_OFFLINE=1 python -m unittest discover -s tests -v
      - name: Dựng tập mới bằng bảng tra chessdb.cn
        id: build
        if: env.BUILD_COUNT != '0' && env.BUILD_COUNT != ''
        run: |
          before=$(ls episodes | sort)
          python scripts/build_episodes.py --count "$BUILD_COUNT"
          after=$(ls episodes | sort)
          new=$(comm -13 <(echo "$before") <(echo "$after") | sed 's/\.json$//' | paste -sd, -)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          CDB_OFFLINE=1 python -m unittest discover -s tests
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add episodes catalog.json data
          git commit -m "feat(cotan): dựng $new từ bảng tra chessdb" || echo "Không có gì mới"
          if ! git pull --rebase --autostash origin main; then
            # Xung đột chỉ có thể ở cache chessdb: gộp hai bên rồi tiếp tục.
            (cd .. && python Tinh-Hoa-Co-Tan/scripts/merge_cdb.py $(git diff --name-only --diff-filter=U))
            GIT_EDITOR=true git rebase --continue
          fi
          git push
      - id: plan
        env:
          NEW: ${{ steps.build.outputs.new }}
        run: |
          sel="$EPISODES"
          if [ "$sel" = "catchup" ]; then
            # Tập mới + tập đã dựng nhưng chưa đăng được (tối đa 4 tập đăng bù mỗi ngày).
            old=$(python scripts/plan.py unpublished 2>/dev/null | python -c "import json,sys; d=json.load(sys.stdin); print(','.join([x['episode'] for x in d['include'] if x['episode'] not in '$NEW'.split(',')][:4]))" || true)
            sel="new:$(echo "$NEW,$old" | sed 's/^,//; s/,$//')"
          elif [ "$sel" = "new" ]; then
            if [ -z "$NEW" ]; then echo "Chọn 'new' nhưng không dựng tập nào"; exit 1; fi
            sel="new:$NEW"
          fi
          echo "matrix=$(python scripts/plan.py "$sel")" >> "$GITHUB_OUTPUT"

  render:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Tinh-Hoa-Co-Tan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tinh-Hoa-Co-Tan/requirements.txt
      - name: Cài đồ hoạ / âm thanh / phông
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-noto-core fonts-noto-cjk
          python -m pip install -r requirements.txt
          if [ "$VOICE" = "edge" ]; then
            python -m pip install vieneu "onnxruntime==1.22.1"
          fi
      - name: Cache mô hình VieNeu
        if: env.VOICE == 'edge'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vieneu-hf-v1
      - uses: typst-community/setup-typst@v5
      - name: Kiểm tra kịch bản trước khi tạo âm thanh/video
        run: |
          # Sinh lại lời bình bằng code mới nhất (không gọi mạng), rồi kiểm tra.
          python scripts/rebuild_beats.py "${{ matrix.episode }}"
          CDB_OFFLINE=1 python scripts/produce.py --episode "${{ matrix.episode }}" --skip-render
      - name: Render MP4
        env:
          ZALO_API_KEY: ${{ secrets.ZALO_API_KEY }}
          COTAN_TTS_ENGINE: ${{ env.VOICE == 'edge' && 'vieneu' || '' }}
          COTAN_TTS_VOICE: "Thiện Minh"
        run: |
          if [ "$TARGETS" != "short" ]; then
            python scripts/produce.py --episode "${{ matrix.episode }}" --quality "$QUALITY" --voice "$VOICE"
          fi
          [ "$TARGETS" = "video" ] || python scripts/make_short.py --episode "${{ matrix.episode }}" --quality "$QUALITY" --voice "$VOICE"
      - uses: actions/upload-artifact@v4
        with:
          name: cotan-${{ matrix.episode }}
          path: |
            Tinh-Hoa-Co-Tan/output/${{ matrix.episode }}/${{ matrix.episode }}.mp4
            Tinh-Hoa-Co-Tan/output/${{ matrix.episode }}/${{ matrix.episode }}_short.mp4
            Tinh-Hoa-Co-Tan/output/${{ matrix.episode }}/timeline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Đăng YouTube (chỉ khi quality=full)
        if: env.QUALITY == 'full'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          EP="${{ matrix.episode }}"
          python - "$EP" <<'PY'
          import json, sys
          full = json.load(open(f'episodes/{sys.argv[1]}.json', encoding='utf-8'))
          d = full.get('youtube') or {}
          open('yt_title.txt', 'w', encoding='utf-8').write(d.get('title', ''))
          open('yt_desc.txt', 'w', encoding='utf-8').write(d.get('description', ''))
          open('yt_tags.txt', 'w', encoding='utf-8').write(','.join(d.get('tags', [])))
          open('yt_playlist.txt', 'w', encoding='utf-8').write(d.get('playlist', ''))
          ys = full.get('youtube_short')
          if not ys:
              kind = 'thủ hòa' if full['verdict']['wdl'] == 'D' else 'cờ tàn'
              ys = {'title': f"Thử thách {kind} #{full['number']}: {full['subtitle']} – bạn giải được không? #Shorts",
                    'description': (f"Câu đố {kind}: tìm nước đi đúng trong thế {full['subtitle']}.\n"
                                    f"Lời giải đầy đủ: video \"{d.get('title', '')}\" trên kênh.\n"
                                    "Kết luận kiểm chứng bằng bảng tra cờ tàn chessdb.cn.\n\n#Shorts #CoTuong #CoTan #TinhHoaCoTan")}
          open('yt_short_title.txt', 'w', encoding='utf-8').write(ys['title'])
          open('yt_short_desc.txt', 'w', encoding='utf-8').write(ys['description'])
          PY
          [ -f "output/$EP/$EP.mp4" ] && python ../scripts/upload_to_youtube.py \
            --file "output/$EP/$EP.mp4" \
            --title "$(cat yt_title.txt)" \
            --description-file yt_desc.txt \
            --tags "$(cat yt_tags.txt)" \
            --playlist-title "$(cat yt_playlist.txt)" \
            --history-key "cotan3_$EP" \
            --category-id 27 \
            --privacy public
          if [ -f "output/$EP/${EP}_short.mp4" ]; then
            python ../scripts/upload_to_youtube.py \
              --file "output/$EP/${EP}_short.mp4" \
              --title "$(cat yt_short_title.txt)" \
              --description-file yt_short_desc.txt \
              --tags "shorts,cờ tướng,cờ tàn,câu đố cờ tướng,tinh hoa cờ tàn" \
              --history-key "cotan3_short_$EP" \
              --category-id 27 \
              --privacy public || echo "Short chưa đăng được"
          fi
      - name: Đăng Facebook Reel (Cờ Tàn Thực Dụng)
        if: env.QUALITY == 'full'
        continue-on-error: true
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1249523211575010' }}
        run: |
          EP="${{ matrix.episode }}"
          SHORT="output/$EP/${EP}_short.mp4"
          if [ ! -f "$SHORT" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "Bỏ qua Facebook Reel."
            exit 0
          fi
          if ! python - "$EP" <<'PY'
          import json, sys
          d = json.load(open(f'episodes/{sys.argv[1]}.json', encoding='utf-8'))
          classic = (d.get('classic') or {}).get('collection')
          raise SystemExit(0 if classic == 'Co-Tan-Thuc-Dung' else 1)
          PY
          then
            echo "Không phải Cờ Tàn Thực Dụng, bỏ qua Reel."
            exit 0
          fi
          python ../scripts/upload_to_facebook_reel.py \
            --file "$SHORT" \
            --title "$(cat yt_short_title.txt)" \
            --description-file yt_short_desc.txt \
            --history-key "cotan3_reel_$EP" \
            --page-id "${FB_PAGE_ID}"
      - name: Lưu lịch sử đăng
        if: env.QUALITY == 'full'
        run: |
          cp ../youtube_uploaded_history.json /tmp/mine.json
          cp ../facebook_uploaded_history.json /tmp/mine_fb.json 2>/dev/null || echo '{}' > /tmp/mine_fb.json
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            # Chỉ chèn các mục của tập này vào bản lịch sử mới nhất (nhiều job ghi song song).
            python - "${{ matrix.episode }}" <<'PY'
          import json, os, sys
          ep = sys.argv[1]
          mine = json.load(open('/tmp/mine.json', encoding='utf-8'))
          path = '../youtube_uploaded_history.json'
          cur = json.load(open(path, encoding='utf-8'))
          for k in (f'cotan3_{ep}', f'cotan3_short_{ep}'):
              if k in mine:
                  cur[k] = mine[k]
          open(path, 'w', encoding='utf-8').write(json.dumps(cur, ensure_ascii=False, indent=2) + '\n')
          fb_path = '../facebook_uploaded_history.json'
          mine_fb = json.load(open('/tmp/mine_fb.json', encoding='utf-8'))
          fb = json.load(open(fb_path, encoding='utf-8')) if os.path.exists(fb_path) else {}
          key = f'cotan3_reel_{ep}'
          if key in mine_fb:
              fb[key] = mine_fb[key]
              open(fb_path, 'w', encoding='utf-8').write(json.dumps(fb, ensure_ascii=False, indent=2) + '\n')
          PY
            git add ../youtube_uploaded_history.json ../facebook_uploaded_history.json
            git commit -q -m "docs(cotan): youtube history for ${{ matrix.episode }}" || break
            git push -q origin HEAD:main && break
            sleep $((i*4))
          done
