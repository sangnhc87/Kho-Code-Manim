name: Render INT01 - Ban chat nguyen ham

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Preview (854x480) or Full HD (1920x1080)'
        required: true
        type: choice
        options: [preview, fullhd]
        default: preview
      voice:
        description: 'Male Vietnamese narration, needs Edge TTS network'
        required: true
        type: choice
        options: ['off', 'on']
        default: 'off'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: Manim-Typst/series-nguyen-ham-tich-phan
    steps:
      - uses: actions/checkout@v4
      - name: Install native system dependencies and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Install Manim and lesson dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          manim --version
          typst --version
      - name: Mathematical tests and Python source checks
        run: |
          python scripts/prepare_int01.py --voice off
          python -m unittest discover -s tests -v
          python -m compileall -q int01 scripts
      - name: Compile 22 real Typst formulas into SVG
        run: python scripts/build_int01_typst.py
      - name: Prepare optional male narration and timed SRT
        env:
          VOICE_MODE: ${{ inputs.voice }}
        run: python scripts/prepare_int01.py --voice "$VOICE_MODE"
      - name: Smoke render all 32 teaching segments in actual Manim
        run: |
          manim -ql -r 426,240 --fps 8 int01/scene.py INT01_SMOKE
          find media/videos -name 'INT01_SMOKE.mp4' -size +1k -print -quit | grep -q .
      - name: Render 854x480 preview (24 FPS)
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 int01/scene.py INT01
      - name: Render 1920x1080 Full HD (30 FPS)
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 int01/scene.py INT01
      - name: Inspect MP4 tracks, timing, 8 chapter frames
        env:
          QUALITY_MODE: ${{ inputs.quality }}
          VOICE_MODE: ${{ inputs.voice }}
        run: |
          VIDEO=$(find media/videos -type f -name INT01.mp4 | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_int01.py --video "$VIDEO" --quality "$QUALITY_MODE" --voice "$VOICE_MODE"
      - name: Publish rendered MP4, subtitles, chapter images and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INT01-${{ inputs.quality }}-voice-${{ inputs.voice }}
          path: |
            media/videos/**/INT01.mp4
            artifacts/int01_qa/
            INT01_vi.srt
            int01/runtime_plan.json
            preview/int01/
          retention-days: 7
          if-no-files-found: warn
      - name: Auto Upload Full HD to YouTube (Public)
        if: ${{ inputs.quality == 'fullhd' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          VIDEO=$(find media/videos -type f -name 'INT01.mp4' | head -n 1)
          python ../../scripts/upload_to_youtube.py             --file "$VIDEO"             --series nguyen_ham_tich_phan             --lesson 1             --category-id 27             --privacy public
      - name: Commit and Push YouTube History
        if: ${{ inputs.quality == 'fullhd' }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ../../youtube_uploaded_history.json
          git commit -m "docs(int01): auto-update youtube_uploaded_history.json" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push
