name: Render COMB05 V2 - Bai giang day du Manim Typst

on:
  push:
    paths:
      - '.trigger_runs'
  workflow_dispatch:
    inputs:
      quality:
        description: 'preview 480p or fullhd 1080p'
        type: choice
        required: true
        default: preview
        options: [preview, fullhd]
      voice:
        description: 'Vietnamese voice. on requires TTS service network availability.'
        type: choice
        required: true
        default: 'on'
        options: ['on', 'off']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Series-Dai-So-To-Hop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Manim system dependencies and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify maths, script and workflow data
        run: python -m unittest discover -s tests -v
      - name: Compile Typst and create Vietnamese speech plus SRT subtitles
        env:
          COMB05_VOICE: ${{ inputs.voice }}
        run: python scripts/prepare_comb05_v2.py --voice "$COMB05_VOICE"
      - name: Render Manim preview
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 episodes/comb05_permutations.py COMB05
      - name: Render Manim full HD
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb05_permutations.py COMB05
      - name: Verify MP4 duration and narration; extract eight chapter frames
        env:
          COMB05_VOICE: ${{ inputs.voice }}
        run: |
          VIDEO=$(find media/videos -type f -name 'COMB05.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_comb05_v2.py --video "$VIDEO" --voice "$COMB05_VOICE"
      - name: Upload rendered MP4, subtitles, chapter images and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMB05-V2-${{ inputs.quality }}-voice-${{ inputs.voice }}
          path: |
            Series-Dai-So-To-Hop/media/videos/**/COMB05.mp4
            Series-Dai-So-To-Hop/qa_comb05_v2/
            Series-Dai-So-To-Hop/narration_COMB05_v2.md
            Series-Dai-So-To-Hop/subtitles_COMB05_v2.srt
            Series-Dai-So-To-Hop/voice/comb05_voice_manifest.json
          if-no-files-found: warn
          retention-days: 7
