name: Render Manim Video
run-name: Render ${{ inputs.script_file == 'custom' && inputs.custom_file || inputs.script_file }}

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: 'Chọn script Manim cần render'
        required: true
        default: 'toc_do_nuoc_dang_3d_dien_tich_mat_thoang.py'
        type: choice
        options:
          - 'bai_12_2_01_oxyz_vecto.py'
          - 'chuyen_de_toc_do_nuoc_dang_3d_ban_moi.py'
          - 'toc_do_nuoc_dang_3d_dien_tich_mat_thoang.py'
          - 'oxyz_tam_ti_cu_hay_la_kho.py'
          - 'bat_phuong_trinh_hai_an.py'
          - 'K12-Ch1-TocDoThayDoi.py'
          - 'duong_tiem_can_toan_12.py'
          - 'duong_tiem_can_toan_thuc_te.py'
          - 'toc_do_nuoc_dang_3D_pro.py'
          - 'toi_uu_hoa_hinh_hoc_va_uon_day.py'
          - 'khoi_tron_xoay_cat_ghep.py'
          - 'he_bat_phuong_trinh_hai_an.py'
          - 'bai_toan_thuc_te_bat_phuong_trinh.py'
          - 'ung_dung_tiem_can.py'
          - 'tiem_can_thuc_te_nang_cao.py'
          - 'toc_do_nuoc_dang.py'
          - 'custom'
      custom_file:
        description: 'Nếu chọn "custom", nhập tên file .py (ví dụ: my_lesson.py)'
        required: false
        default: ''
        type: string

jobs:
  render:
    name: Render Manim Video
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MANIM_OUTPUT_DIR: /tmp/manim-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Giả lập môi trường Colab & cấu hình quyền hệ thống
        run: |
          # 1. Tạo thư mục /content và /tmp/manim-output tương thích mọi loại script
          sudo mkdir -p /content /tmp/manim-output
          sudo chmod -R 777 /content /tmp/manim-output

          # 2. Tạo wrapper cho apt-get để script Python gọi apt-get tự động chạy dưới quyền sudo
          sudo tee /usr/local/bin/apt-get > /dev/null << 'EOF'
          #!/bin/bash
          exec sudo /usr/bin/apt-get "$@"
          EOF
          sudo chmod +x /usr/local/bin/apt-get

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài đặt công cụ hệ thống (FFmpeg, LaTeX, Fonts, Cairo, Pango)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            pkg-config \
            build-essential \
            python3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            fonts-dejavu \
            fonts-dejavu-core \
            fonts-noto-core \
            fonts-noto-cjk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            tipa \
            dvisvgm \
            espeak-ng \
            sox

      - name: Cài đặt thư viện Python (Manim, Edge-TTS, ...)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Xác định script cần chạy
        id: target
        run: |
          SELECTED="${{ inputs.script_file }}"
          CUSTOM="${{ inputs.custom_file }}"
          if [ "$SELECTED" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then
              echo "::error::Bạn đã chọn 'custom' nhưng chưa nhập tên file trong ô custom_file!"
              exit 1
            fi
            TARGET="$CUSTOM"
          else
            TARGET="$SELECTED"
          fi

          if [ ! -f "$TARGET" ]; then
            echo "::error::Không tìm thấy file: $TARGET trong thư mục repository!"
            exit 1
          fi

          BASE_NAME=$(basename "$TARGET" .py)
          echo "target_script=$TARGET" >> "$GITHUB_OUTPUT"
          echo "target_name=$BASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Script được chọn: $TARGET (Tên: $BASE_NAME)"

      - name: Chạy script render Manim
        run: |
          TARGET="${{ steps.target.outputs.target_script }}"
          echo "=========================================="
          echo "BẮT ĐẦU RENDER BÀI GIẢNG: $TARGET"
          echo "=========================================="
          python "$TARGET"

      - name: Thu thập tệp xuất bản
        id: collect_videos
        if: always()
        run: |
          echo "Thu thập tất cả video MP4 và tệp phụ trợ (SRT, VTT, ZIP) từ mọi thư mục đầu ra..."
          
          # Danh sách tất cả các nơi script Manim có thể xuất video ra
          SEARCH_DIRS=(
            "/tmp/manim-output"
            "/tmp/manim-video-output"
            "${RUNNER_TEMP:-/tmp}/manim-video-output"
            "${RUNNER_TEMP:-/tmp}"
            "/content"
            "/tmp"
            "${{ github.workspace }}/renders"
          )
          
          for d in "${SEARCH_DIRS[@]}"; do
            if [ -d "$d" ]; then
              echo "==> Đang quét và gom tệp từ: $d"
              find "$d" -type f \( -name "*.mp4" -o -name "*.srt" -o -name "*.vtt" -o -name "*.zip" \) \
                -not -path "*/partial_movie_files/*" \
                -not -path "*/.venv/*" \
                -not -path "*/.git/*" \
                -exec cp -vn {} . \; 2>/dev/null || true
            fi
          done

          COUNT=$(find . -maxdepth 2 -type f -name "*.mp4" -not -path "*/partial_movie_files/*" -not -path "./.venv/*" | wc -l)
          echo "Đã tìm thấy tổng cộng $COUNT video trong workspace."

          # Xuất báo cáo tóm tắt ra GitHub Step Summary
          echo "### 🎬 Danh sách tệp đã tạo thành công" >> $GITHUB_STEP_SUMMARY
          echo "| Tên tệp | Loại | Dung lượng |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          FOUND=0
          for f in *; do
            case "$f" in
              *.mp4|*.srt|*.vtt|*_ma_nguon.zip)
                if [ -f "$f" ]; then
                  SIZE=$(ls -lh "$f" | awk '{print $5}')
                  NAME=$(basename "$f")
                  EXT="${NAME##*.}"
                  echo "| **$NAME** | $EXT | $SIZE |" >> $GITHUB_STEP_SUMMARY
                  FOUND=1
                fi
                ;;
            esac
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "| *(Chưa tìm thấy tệp nào)* | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Nhấn vào đây để tải tệp Artifacts](#artifacts)** (hoặc cuộn xuống cuối trang này ở mục **Artifacts**)." >> $GITHUB_STEP_SUMMARY

      - name: Upload rendered videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manim-${{ steps.target.outputs.target_name || 'render-output' }}
          path: |
            *.mp4
            *.srt
            *.vtt
            *_ma_nguon.zip
            **/*.mp4
            **/*.srt
            **/*.vtt
            **/*_ma_nguon.zip
            /tmp/manim-output/**
            !**/partial_movie_files/**
            !**/.venv/**
          if-no-files-found: warn
          retention-days: 14
