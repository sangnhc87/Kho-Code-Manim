name: Render COMB07 V2 - Bai giang To Hop Manim Typst

on:
  push:
    paths:
      - '.trigger_runs'
  workflow_dispatch:
    inputs:
      quality:
        description: 'Render preview 480p or Full HD 1080p'
        type: choice
        required: true
        default: fullhd
        options: [fullhd, preview]
      voice:
        description: 'Vietnamese narration (on requires connection to TTS provider)'
        type: choice
        required: true
        default: 'on'
        options: ['on','off']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Series-Dai-So-To-Hop
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Manim system dependencies and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run all mathematical and structural tests
        run: python -m unittest discover -s tests -v
      - name: Compile Typst equations and prepare audio/subtitles
        env:
          COMB07_VOICE: ${{ inputs.voice || 'on' }}
        run: python scripts/prepare_comb07_v2.py --voice "$COMB07_VOICE"
      - name: Render 480p preview
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 episodes/comb07_combinations.py COMB07
      - name: Render Full HD 1080p
        if: ${{ inputs.quality == 'fullhd' || github.event_name == 'push' || github.event.inputs.quality == null }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb07_combinations.py COMB07
      - name: Audit runtime, audio stream, resolution and eight chapter frames
        env:
          COMB07_VOICE: ${{ inputs.voice || 'on' }}
        run: |
          VIDEO=$(find media/videos -type f -name 'COMB07.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_comb07_v2.py --video "$VIDEO" --voice "$COMB07_VOICE"
      - name: Publish video and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMB07-V2-${{ inputs.quality }}-voice-${{ inputs.voice || 'on' }}
          path: |
            Series-Dai-So-To-Hop/media/videos/**/COMB07.mp4
            Series-Dai-So-To-Hop/qa_comb07_v2/
            Series-Dai-So-To-Hop/narration_COMB07_v2.md
            Series-Dai-So-To-Hop/subtitles_COMB07_v2.srt
            Series-Dai-So-To-Hop/voice/comb07_voice_manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Auto Upload Full HD to YouTube (Public)
        if: ${{ success() && (inputs.quality == 'fullhd' || github.event_name == 'push' || github.event.inputs.quality == null) }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-oauthlib
          VIDEO_FILE=$(find media/videos -type f -name 'COMB07.mp4' | head -n 1)
          python ../scripts/upload_to_youtube.py --file "$VIDEO_FILE" --series to_hop --lesson 7 --privacy public
