name: Render COMB04 V2 - Bai giang day du Manim Typst

on:
  push:
    paths:
      - '.trigger_runs'
  workflow_dispatch:
    inputs:
      quality:
        description: 'preview 480p or fullhd 1080p'
        type: choice
        required: true
        default: fullhd
        options: [fullhd, preview]
      voice:
        description: 'Vietnamese voice. on requires TTS service network availability.'
        type: choice
        required: true
        default: 'on'
        options: ['on', 'off']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Series-Dai-So-To-Hop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Manim system dependencies and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify maths, script and workflow data
        run: python -m unittest discover -s tests -v
      - name: Compile Typst and create Vietnamese speech plus SRT subtitles
        env:
          COMB04_VOICE: ${{ inputs.voice || 'on' }}
        run: python scripts/prepare_comb04_v2.py --voice "$COMB04_VOICE"
      - name: Render Manim preview
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 episodes/comb04_order_matters.py COMB04
      - name: Render Manim full HD
        if: ${{ inputs.quality == 'fullhd' || github.event_name == 'push' || github.event.inputs.quality == null }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb04_order_matters.py COMB04
      - name: Verify MP4 duration and narration; extract eight chapter frames
        env:
          COMB04_VOICE: ${{ inputs.voice || 'on' }}
        run: |
          VIDEO=$(find media/videos -type f -name 'COMB04.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_comb04_v2.py --video "$VIDEO" --voice "$COMB04_VOICE"
      - name: Upload rendered MP4, subtitles, chapter images and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMB04-V2-${{ inputs.quality }}-voice-${{ inputs.voice || 'on' }}
          path: |
            Series-Dai-So-To-Hop/media/videos/**/COMB04.mp4
            Series-Dai-So-To-Hop/qa_comb04_v2/
            Series-Dai-So-To-Hop/narration_COMB04_v2.md
            Series-Dai-So-To-Hop/subtitles_COMB04_v2.srt
            Series-Dai-So-To-Hop/voice/comb04_voice_manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Auto Upload Full HD to YouTube (Public)
        if: ${{ success() && (inputs.quality == 'fullhd' || github.event_name == 'push' || github.event.inputs.quality == null) }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-oauthlib
          VIDEO_FILE=$(find media/videos -type f -name 'COMB04.mp4' | head -n 1)
          python ../scripts/upload_to_youtube.py --file "$VIDEO_FILE" --series to_hop --lesson 4 --privacy public
