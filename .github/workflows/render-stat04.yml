name: Render STAT04 - Tu phan vi Q1 Q2 Q3 - Manim Typst

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Preview or Full HD
        type: choice
        required: true
        default: preview
        options: [preview, fullhd]
      voice:
        description: Vietnamese TTS (Internet required)
        type: choice
        required: true
        default: 'off'
        options: ['off','on']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Manim-Typst/series-thong-ke
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Install Manim and audio packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile STAT04 Typst SVG assets
        run: python scripts/build_stat04_typst.py
      - name: Prepare Vietnamese narration, SRT and runtime
        env:
          STAT04_VOICE: ${{ inputs.voice }}
        run: python scripts/prepare_stat04.py --voice "$STAT04_VOICE"
      - name: "Unit tests: STAT01 to STAT04"
        run: python -m unittest discover -s tests -v
      - name: Render preview 854x480 24fps
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 stat04/scene.py STAT04
      - name: Render FullHD 1920x1080 30fps
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 stat04/scene.py STAT04
      - name: Verify MP4 technical properties and extract eight frames
        env:
          STAT04_QUALITY: ${{ inputs.quality }}
          STAT04_VOICE: ${{ inputs.voice }}
        run: |
          VIDEO=$(find media/videos -type f -name 'STAT04.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_stat04.py --video "$VIDEO" --quality "$STAT04_QUALITY" --voice "$STAT04_VOICE"
      - name: Upload MP4 and teaching review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAT04-${{ inputs.quality }}-voice-${{ inputs.voice }}
          path: |
            Manim-Typst/series-thong-ke/media/videos/**/STAT04.mp4
            Manim-Typst/series-thong-ke/artifacts/stat04_qa/
            Manim-Typst/series-thong-ke/STAT04_vi.srt
            Manim-Typst/series-thong-ke/stat04/runtime_plan.json
            Manim-Typst/series-thong-ke/preview/stat04/
          retention-days: 7
          if-no-files-found: warn
      - name: Auto Upload Full HD to YouTube (Public)
        if: ${{ inputs.quality == 'fullhd' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          VIDEO=$(find media/videos -type f -name 'STAT04.mp4' | head -n 1)
          python ../../scripts/upload_to_youtube.py \
            --file "$VIDEO" \
            --series thong_ke \
            --lesson 4 \
            --category-id 27 \
            --privacy public
      - name: Commit and Push YouTube History
        if: ${{ inputs.quality == 'fullhd' }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ../../youtube_uploaded_history.json
          git commit -m "docs(stat04): auto-update youtube_uploaded_history.json" || echo "No changes to commit"
          git pull --rebase origin main
          git push
