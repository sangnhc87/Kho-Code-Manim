name: Render COMB09 V2 - Chon co lap va lap day n mu k

on:
  push:
    paths:
      - '.trigger_runs'
  workflow_dispatch:
    inputs:
      quality:
        description: '480p preview or 1080p Full HD'
        type: choice
        required: true
        default: preview
        options: [preview, fullhd]
      voice:
        description: 'Vietnamese TTS; on requires external TTS access'
        type: choice
        required: true
        default: 'off'
        options: ['off', 'on']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Series-Dai-So-To-Hop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install FFmpeg, Manim libraries and Vietnamese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config build-essential libcairo2-dev libpango1.0-dev \
            fonts-noto-core fonts-noto-extra libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev
          fc-match 'Noto Sans'
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Mathematics and production tests
        run: python -m unittest discover -s tests -v
      - name: Prepare PNG formula sheets, voice and synchronized subtitles
        env:
          COMB09_VOICE: ${{ inputs.voice }}
        run: python scripts/prepare_comb09_v2.py --voice "$COMB09_VOICE"
      - name: Render preview 854x480 24 fps
        if: ${{ inputs.quality == 'preview' }}
        run: manim -ql -r 854,480 --fps 24 episodes/comb09_repetition.py COMB09
      - name: Render final Full HD 1920x1080 30 fps
        if: ${{ inputs.quality == 'fullhd' }}
        run: manim -qh -r 1920,1080 --fps 30 episodes/comb09_repetition.py COMB09
      - name: Verify MP4 time, audio stream, frame captures
        env:
          COMB09_VOICE: ${{ inputs.voice }}
        run: |
          VIDEO=$(find media/videos -type f -name 'COMB09.mp4' | head -n 1)
          test -n "$VIDEO"
          python scripts/qa_comb09_v2.py --video "$VIDEO" --voice "$COMB09_VOICE"
      - name: Always upload video, PNG screenshots and QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COMB09-V2-${{ inputs.quality }}-voice-${{ inputs.voice }}
          path: |
            Series-Dai-So-To-Hop/media/videos/**/COMB09.mp4
            Series-Dai-So-To-Hop/qa_comb09_v2/
            preview/comb09_v2/
            Series-Dai-So-To-Hop/narration_COMB09_v2.md
            Series-Dai-So-To-Hop/subtitles_COMB09_v2.srt
            Series-Dai-So-To-Hop/voice/comb09_voice_manifest.json
          if-no-files-found: warn
          retention-days: 7
